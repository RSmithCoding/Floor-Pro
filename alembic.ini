# Development only: used to generate new migration revisions, e.g.
#   uv run alembic revision -m "add jobs table"
# The running app builds its Alembic config in code (src/floorpro/migrate.py).

[alembic]
script_location = src/floorpro/migrations
sqlalchemy.url = sqlite:///dev-data/floorpro.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
