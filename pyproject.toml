[project]
name = "floorpro"
version = "0.1.0"
description = "Desktop shop-management app for flooring retailers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "platformdirs>=4.2",
    "pywebview>=5.0",
]

[project.scripts]
floorpro = "floorpro.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorpro"]
artifacts = ["src/floorpro/static/css/app.css"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 10k-row performance tests"]
addopts = "--strict-markers"
filterwarnings = [
    # Starlette 1.x suggests httpx2 for its TestClient; httpx still works. Revisit when adopting httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
