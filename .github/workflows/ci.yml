name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Fetch Tailwind CLI
        run: uv run python scripts/fetch_tailwind.py

      - name: Build CSS
        run: uv run python scripts/build_css.py

      - name: Tests
        run: uv run pytest
